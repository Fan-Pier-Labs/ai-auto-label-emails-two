platform: "fargate"
app_name: "ai-email-labels-2"
aws:
  profile: "ryanhughes624"
  region: "us-east-2"
# public:
#   domain: "ai-email-labels.fanpierlabs.com"
#   mode: "production"

task:
  cpu: 1024
  memory: 2048
  spot: true
  replicas: 1
  ephemeral_storage: 21
  port: 8080

secrets:
  - arn:aws:secretsmanager:us-east-2:066949051862:secret:AI_EMAIL_LABELING_APP-6h2UPx

# Required: ecsTaskExecutionRole needs GetSecretValue so the task can read secrets at runtime.
custom_iam_policy:
  Version: "2012-10-17"
  Statement:
    - Effect: Allow
      Action: secretsmanager:GetSecretValue
      Resource: arn:aws:secretsmanager:us-east-2:066949051862:secret:AI_EMAIL_LABELING_APP-6h2UPx
# Change this to true after you set the name of this project.
allow_create: true



